<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>PRECISION</title>
<style>
:root {
  --c1: 60, 140, 255;
  --c2: 160, 100, 255;
  --grad: linear-gradient(135deg, #4af, #a4f);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }

html, body {
  width: 100%; height: 100%;
  background: #0a0a0f;
  color: #fff;
  font-family: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
}

#wrap {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px 20px;
  padding-top: max(24px, env(safe-area-inset-top));
  padding-bottom: max(24px, env(safe-area-inset-bottom));
}

/* 상단 */
#top-bar { width: 100%; max-width: 360px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.badge { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 5px 14px; font-size: 12px; color: rgba(255,255,255,0.5); cursor: pointer; }

/* 점수 */
#score-wrap { text-align: center; margin-bottom: 6px; }
#score { font-size: 60px; font-weight: 900; line-height: 1; letter-spacing: -3px; transition: transform 0.08s; }
#score.pop { transform: scale(1.15); }
#best-line { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 2px; }
#combo { font-size: 17px; font-weight: 700; height: 24px; margin-top: 4px; }

/* 등급 */
#grade-wrap { text-align: center; min-height: 50px; margin-bottom: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#grade-label { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
#grade-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-top: 2px; }

/* 스테이지 바 */
#stage-bar-wrap { width: 100%; max-width: 300px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-bottom: 20px; overflow: hidden; }
#stage-bar { height: 100%; width: 0%; background: var(--grad); border-radius: 2px; transition: width 0.4s; }

/* 게임 원 영역 */
#arena {
  position: relative;
  width: 240px; height: 240px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  touch-action: none;
  -webkit-touch-callout: none;
}

/* 경계선 */
#boundary {
  position: absolute;
  width: 240px; height: 240px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.18);
  pointer-events: none;
}
/* 위험존 (빨간 링) */
#danger-ring {
  position: absolute;
  width: 240px; height: 240px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, transparent 82%, rgba(255,70,70,0.20) 100%);
}

/* 성장하는 공 */
#ball {
  position: absolute;
  border-radius: 50%;
  background: rgba(var(--c1), 0.25);
  border: 2px solid rgba(var(--c1), 0.7);
  box-shadow: 0 0 16px rgba(var(--c1), 0.35);
  display: flex; align-items: center; justify-content: center;
  pointer-events: none;
  /* 크기는 JS가 직접 width/height로 제어 */
  width: 24px; height: 24px;
}
#ball-text { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.85); white-space: nowrap; }

/* 파티클 */
.particle {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  animation: fly 0.7s ease-out forwards;
}
@keyframes fly {
  0%   { opacity: 1; transform: translate(0,0) scale(1); }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
}

/* 피드백 */
#feedback {
  position: fixed;
  top: 30%;
  left: 50%;
  transform: translateX(-50%) translateY(0);
  font-size: 24px; font-weight: 900;
  pointer-events: none;
  opacity: 0;
  white-space: nowrap;
  letter-spacing: -0.5px;
  z-index: 50;
}

/* 오버레이 */
#overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(8,8,14,0.97);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  z-index: 100; text-align: center; padding: 24px;
  padding-top: max(24px, env(safe-area-inset-top));
  padding-bottom: max(24px, env(safe-area-inset-bottom));
  -webkit-overflow-scrolling: touch;
}
.ov-title { font-size: 46px; font-weight: 900; letter-spacing: -2px; background: var(--grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin-bottom: 4px; }
.ov-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 20px; line-height: 1.7; }
.result-score { font-size: 76px; font-weight: 900; line-height: 1; }
.result-label { font-size: 12px; color: rgba(255,255,255,0.35); margin-top: 2px; }
.result-best { font-size: 13px; color: #f0c040; height: 20px; margin-top: 6px; }
.stat-row { display: flex; gap: 8px; margin: 16px 0; width: 100%; max-width: 320px; }
.stat-box { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 4px; text-align: center; }
.stat-val { font-size: 20px; font-weight: 700; }
.stat-lbl { font-size: 10px; color: rgba(255,255,255,0.4); margin-top: 2px; }
#start-btn { display: block; padding: 16px 48px; border-radius: 50px; border: none; font-size: 17px; font-weight: 700; cursor: pointer; background: var(--grad); color: white; -webkit-appearance: none; appearance: none; margin-top: 8px; min-width: 200px; position: relative; z-index: 110; }
.tip { font-size: 11px; color: rgba(255,255,255,0.2); margin-top: 12px; line-height: 1.8; }

#tab-bar { display: flex; margin-bottom: 16px; background: rgba(255,255,255,0.05); border-radius: 10px; padding: 3px; }
.tab { padding: 7px 18px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; color: rgba(255,255,255,0.4); }
.tab.on { background: rgba(255,255,255,0.1); color: white; }

#skin-panel { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 300px; }
#skin-panel p { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 12px; }
.skin-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; width: 100%; }
.skin-card { border-radius: 14px; padding: 12px 8px; text-align: center; cursor: pointer; border: 2px solid transparent; background: rgba(255,255,255,0.04); }
.skin-card.on { border-color: rgba(255,255,255,0.5); }
.skin-dot { width: 36px; height: 36px; border-radius: 50%; margin: 0 auto 7px; }
.skin-name { font-size: 11px; color: rgba(255,255,255,0.6); }

#stats-panel { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 300px; }
.sg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-bottom: 10px; }
.sc { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 12px; }
.sv { font-size: 24px; font-weight: 700; margin-bottom: 2px; }
.sl { font-size: 11px; color: rgba(255,255,255,0.4); }
#hlist { width: 100%; max-height: 130px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.hi { display: flex; justify-content: space-between; padding: 7px 8px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 12px; }
.hi:last-child { border-bottom: none; }
.hs { font-weight: 700; }
.hm { color: rgba(255,255,255,0.35); font-size: 11px; }
.reset-btn { margin-top: 10px; padding: 7px 18px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.15); background: transparent; color: rgba(255,255,255,0.4); font-size: 12px; cursor: pointer; -webkit-appearance: none; }

/* ── 순위판 ── */
#lb-panel { display:none; flex-direction:column; align-items:center; width:100%; max-width:300px; }
#lb-title { font-size:18px; font-weight:700; margin-bottom:12px; }
#lb-list { width:100%; max-height:260px; overflow-y:auto; -webkit-overflow-scrolling:touch; }
.lb-row { display:flex; align-items:center; padding:9px 10px; border-bottom:1px solid rgba(255,255,255,0.06); font-size:13px; gap:10px; }
.lb-row:last-child { border-bottom:none; }
.lb-rank { font-size:16px; font-weight:900; width:28px; text-align:center; flex-shrink:0; }
.lb-rank.gold   { color:#ffd700; }
.lb-rank.silver { color:#c0c0c0; }
.lb-rank.bronze { color:#cd7f32; }
.lb-name { flex:1; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.lb-score { font-weight:700; color:rgba(255,255,255,0.85); flex-shrink:0; }
.lb-perf  { font-size:11px; color:rgba(255,255,255,0.35); flex-shrink:0; }
#lb-loading { text-align:center; padding:24px; color:rgba(255,255,255,0.3); font-size:13px; }
#lb-empty   { text-align:center; padding:24px; color:rgba(255,255,255,0.25); font-size:13px; }

/* 닉네임 입력 모달 */
#nick-modal {
  position:fixed; top:0; left:0; width:100%; height:100%;
  background:rgba(0,0,0,0.75); z-index:200;
  display:none; align-items:center; justify-content:center;
  padding:24px;
}
#nick-box {
  background:#1a1a26; border-radius:20px; padding:28px 24px;
  width:100%; max-width:300px; text-align:center;
}
#nick-box h3 { font-size:18px; font-weight:700; margin-bottom:6px; }
#nick-box p  { font-size:13px; color:rgba(255,255,255,0.4); margin-bottom:18px; }
#nick-input {
  width:100%; padding:12px 16px; border-radius:12px;
  border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.07);
  color:#fff; font-size:16px; outline:none; margin-bottom:14px;
  -webkit-appearance:none; text-align:center;
}
#nick-input::placeholder { color:rgba(255,255,255,0.3); }
#nick-submit {
  width:100%; padding:13px; border-radius:12px; border:none;
  font-size:16px; font-weight:700; color:#fff; cursor:pointer;
  -webkit-appearance:none;
}
#nick-skip {
  display:block; margin-top:10px; font-size:12px;
  color:rgba(255,255,255,0.3); cursor:pointer; background:none;
  border:none; width:100%; text-align:center;
}
</style>

<script>

// ── 결과 화면 전역 상태 ──
var _resultIsNew = false;
var _resultAvgP  = 0;

function showResultOverlay() {
  document.getElementById('r-score').textContent = score;
  document.getElementById('r-best').textContent  = _resultIsNew ? '🏆 신기록!' : '최고: ' + bestScore + '점';
  document.getElementById('r-stats').style.display = 'flex';
  document.getElementById('rs-taps').textContent  = totalTaps;
  document.getElementById('rs-perf').textContent  = perfectCount;
  document.getElementById('rs-avg').textContent   = _resultAvgP + '%';
  document.getElementById('rs-combo').textContent = maxCombo;
  startBtn.textContent = '다시하기';
  bestDisp.textContent = bestScore;
  showTab('r');
  overlayEl.style.display = 'flex';
}

// ── Firebase db 참조 ──
var db = null;
// Firebase 준비될 때까지 폴링 (최대 5초)
(function waitDB() {
  if (window._db) { db = window._db; return; }
  setTimeout(waitDB, 100);
})();

// ── 순위판 로드 ──
function loadLeaderboard() {
  var listEl = document.getElementById('lb-list');
  listEl.innerHTML = '<div id="lb-loading">불러오는 중...</div>';
  if (!db) { listEl.innerHTML = '<div id="lb-empty">연결 실패. 인터넷을 확인하세요.</div>'; return; }
  db.ref('scores').orderByChild('score').limitToLast(20).once('value')
    .then(function(snap) {
      var rows = [];
      snap.forEach(function(child) { rows.push(child.val()); });
      rows.reverse(); // 높은 점수 먼저
      if (!rows.length) {
        listEl.innerHTML = '<div id="lb-empty">아직 등록된 점수가 없어요</div>';
        return;
      }
      listEl.innerHTML = rows.map(function(r, i) {
        var rankClass = i===0?'gold':i===1?'silver':i===2?'bronze':'';
        var rankIcon  = i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1)+'';
        return '<div class="lb-row">' +
          '<div class="lb-rank ' + rankClass + '">' + rankIcon + '</div>' +
          '<div class="lb-name">' + escHtml(r.name) + '</div>' +
          '<div class="lb-score">' + r.score + '점</div>' +
          '<div class="lb-perf">P:' + (r.perfect||0) + '</div>' +
        '</div>';
      }).join('');
    })
    .catch(function() {
      listEl.innerHTML = '<div id="lb-empty">불러오기 실패. 인터넷을 확인하세요.</div>';
    });
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ── 점수 등록 ──
function submitScore(name, scoreVal, perfectVal) {
  if (!db) { console.warn('DB 없음, 점수 저장 실패'); return; }
  db.ref('scores').push({
    name: name,
    score: scoreVal,
    perfect: perfectVal,
    ts: Date.now()
  });
}

// ── 닉네임 모달 ──
var pendingScore = null;
var pendingPerf  = null;

function showNickModal(s, p) {
  pendingScore = s;
  pendingPerf  = p;
  var modal = document.getElementById('nick-modal');
  var input = document.getElementById('nick-input');

  modal.style.display = 'flex';
  setTimeout(function(){ input.focus(); }, 300);
}

function closeNickModal() {
  document.getElementById('nick-modal').style.display = 'none';
}

  {id:'gold',  name:'골드',   grad:'linear-gradient(135deg,#fa4,#f84)', c1:'255,190,40',  c2:'255,120,40',  star:'#fa4'},
  {id:'ice',   name:'아이스', grad:'linear-gradient(135deg,#8cf,#acf)', c1:'120,190,255', c2:'180,200,255', star:'#8cf'},
];

var BALL_MIN   = 12;   // 공 최소 반지름
var T_START    = 3.0;  // 초기 팽창 시간(초)
var T_MIN      = 0.7;  // 최소 팽창 시간
var T_STEP     = 0.14; // 스테이지당 감소

var GRADES = [
  {min:0.95, label:'PERFECT ✦', color:'#ffffff', pts:100},
  {min:0.85, label:'GREAT',     color:'#ffc800', pts:60},
  {min:0.70, label:'GOOD',      color:'#44aaff', pts:30},
  {min:0.50, label:'OK',        color:'#88aaff', pts:12},
  {min:0,    label:'TOO EARLY', color:'#666666', pts:2},
];

// ── 게임 상태 ──
var score=0, combo=0, maxCombo=0, totalTaps=0, perfectCount=0;
var prox_list=[];
var bestScore = +( localStorage.getItem('pBest') || 0 );
var totalGames = +( localStorage.getItem('pGames') || 0 );
var gameHistory = JSON.parse( localStorage.getItem('pHist') || '[]' );

var stage = 1;
var expandTime = T_START;
var roundProgress = 0;
var lastTime = 0;
var rafId = 0;

// ── DOM ──
var scoreEl    = document.getElementById('score');
var comboEl    = document.getElementById('combo');
var bestDisp   = document.getElementById('best-disp');
var stageNum   = document.getElementById('stage-num');
var stageBar   = document.getElementById('stage-bar');

var gradeSub   = document.getElementById('grade-sub');

// ── 테마 적용 ──
function applySkin() {
  document.documentElement.style.setProperty('--grad', skin.grad);
  document.documentElement.style.setProperty('--c1', skin.c1);
  document.documentElement.style.setProperty('--c2', skin.c2);
  ballEl.style.background  = 'rgba(' + skin.c1 + ',0.22)';
  ballEl.style.borderColor  = 'rgba(' + skin.c1 + ',0.7)';
  ballEl.style.boxShadow    = '0 0 16px rgba(' + skin.c1 + ',0.3)';
  document.getElementById('stage-bar').style.background = skin.grad;
  startBtn.style.background = skin.grad;
}
applySkin();

// ── 공 크기/색 업데이트 ──
function updateBall(p) {
  var r = BALL_MIN + (BOUNDARY_R - BALL_MIN) * p;
  var d = r * 2;
  ballEl.style.width  = d + 'px';
  ballEl.style.height = d + 'px';

  var danger = Math.max(0, (p - 0.6) / 0.4);
  var c1r = Math.round(lerp(+skin.c1.split(',')[0], 255, danger));
  var c1g = Math.round(lerp(+skin.c1.split(',')[1],  60, danger));
  var c1b = Math.round(lerp(+skin.c1.split(',')[2],  60, danger));
  var alpha = (0.22 + 0.65 * p).toFixed(2);
  var bAlpha = (0.5 + 0.5 * p).toFixed(2);
  var glow = Math.round(10 + p * 30);

  ballEl.style.background   = 'rgba(' + c1r + ',' + c1g + ',' + c1b + ',' + alpha + ')';
  ballEl.style.borderColor  = 'rgba(' + c1r + ',' + c1g + ',' + c1b + ',' + bAlpha + ')';
  ballEl.style.boxShadow    = '0 0 ' + glow + 'px rgba(' + c1r + ',' + c1g + ',' + c1b + ',0.5)';
  ballEl.style.borderWidth  = Math.round(2 + p * 3) + 'px';

  var fs = Math.max(9, Math.round(10 + r * 0.08));
  ballText.style.fontSize = fs + 'px';
  ballText.style.opacity = p < 0.12 ? (p / 0.12).toFixed(2) : '1';
}

function lerp(a, b, t) { return a + (b - a) * t; }

// ── 라운드 루프 ──
function roundLoop(ts) {
  if (!gameActive) return;
  if (lastTime === 0) lastTime = ts;
  var dt = Math.min((ts - lastTime) / 1000, 0.1); // 최대 100ms cap
  lastTime = ts;

  roundProgress = Math.min(roundProgress + dt / expandTime, 1);
  updateBall(roundProgress);

  if (roundProgress >= 1) {
    endGame(true);
    return;
  }
  rafId = requestAnimationFrame(roundLoop);
}

function startRound() {
  if (!gameActive) return;
  roundProgress = 0;
  lastTime = 0;
  expandTime = Math.max(T_MIN, T_START - (stage - 1) * T_STEP);
  stageNum.textContent = stage;
  var maxStage = Math.ceil((T_START - T_MIN) / T_STEP) + 1;
  stageBar.style.width = Math.min((stage - 1) / (maxStage - 1) * 100, 100) + '%';
  updateBall(0);
  cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(roundLoop);
}

// ── 탭 처리 ──
function handleTap(e) {
  if (!gameActive) return;
  if (overlayEl.style.display !== 'none') return;
  e.preventDefault();
  e.stopPropagation();

  cancelAnimationFrame(rafId);

  var p = roundProgress;
  prox_list.push(p);
  totalTaps++;

  var grade = GRADES[GRADES.length - 1];
  for (var i = 0; i < GRADES.length; i++) {
    if (p >= GRADES[i].min) { grade = GRADES[i]; break; }
  }

  var pts = grade.pts;
  combo++;
  if (combo > maxCombo) maxCombo = combo;
  if (combo >= 5 && grade.min >= 0.5) pts = Math.round(pts * (1 + combo * 0.05));
  if (grade.min >= 0.95) perfectCount++;

  score += pts;
  stage++;

  scoreEl.textContent = score;
  scoreEl.classList.add('pop');
  setTimeout(function(){ scoreEl.classList.remove('pop'); }, 90);

  comboEl.textContent = combo >= 3 ? combo + ' COMBO!' : '';
  comboEl.style.color = combo >= 10 ? '#f84' : combo >= 5 ? 'rgba(' + skin.c1 + ',1)' : '#f0c040';

  gradeLabel.textContent = grade.label;
  gradeLabel.style.color = grade.color;
  gradeSub.textContent = '근접도 ' + Math.round(p * 100) + '% · +' + pts + '점';

  showFeedback(grade.label + ' +' + pts, grade.color);
  spawnParticles(e, grade.color, grade.min >= 0.95 ? 24 : grade.min >= 0.70 ? 14 : 8);
  playTone(grade.min);

  startRound();
}

function addEL(el, ev, fn, opts) {
  if (!el) return;
  el.addEventListener(ev, fn, opts || false);
}

// Arena tap
addEL(arenaEl, 'touchstart', handleTap, {passive: false});
addEL(arenaEl, 'mousedown',  handleTap, false);

// Start button - both touch and click for Safari

// ── 피드백 ──
var fbTimer = null;
function showFeedback(txt, color) {
  feedbackEl.textContent = txt;
  feedbackEl.style.color = color;
  feedbackEl.style.opacity = '1';
  feedbackEl.style.transform = 'translateX(-50%) translateY(-16px)';
  feedbackEl.style.transition = 'none';
  clearTimeout(fbTimer);
  fbTimer = setTimeout(function(){
    feedbackEl.style.transition = 'opacity 0.4s, transform 0.4s';
    feedbackEl.style.opacity = '0';
    feedbackEl.style.transform = 'translateX(-50%) translateY(-40px)';
  }, 500);
}

// ── 파티클 (CSS 기반, Canvas 없음) ──
function spawnParticles(e, color, n) {
  var cx, cy;
  if (e && e.touches && e.touches.length > 0) {
    cx = e.touches[0].clientX;
    cy = e.touches[0].clientY;
  } else if (e && e.clientX !== undefined) {
    cx = e.clientX;
    cy = e.clientY;
  } else {
    var rect = arenaEl.getBoundingClientRect();
    cx = rect.left + rect.width / 2;
    cy = rect.top + rect.height / 2;
  }
  for (var i = 0; i < n; i++) {
    var p = document.createElement('div');
    p.className = 'particle';
    var angle = (Math.PI * 2 * i / n) + Math.random() * 0.5;
    var dist = 40 + Math.random() * 60;
    var dx = Math.round(Math.cos(angle) * dist);
    var dy = Math.round(Math.sin(angle) * dist);
    var sz = 4 + Math.round(Math.random() * 6);
    p.style.cssText = [
      'left:' + (cx - sz/2) + 'px',
      'top:' + (cy - sz/2) + 'px',
      'width:' + sz + 'px',
      'height:' + sz + 'px',
      'background:' + color,
      '--dx:' + dx + 'px',
      '--dy:' + dy + 'px',
      'animation-duration:' + (0.5 + Math.random() * 0.3) + 's'
    ].join(';');
    document.body.appendChild(p);
    setTimeout(function(el){ el.parentNode && el.parentNode.removeChild(el); }, 900, p);
  }
}

// ── 오디오 (Web Audio) ──
var audioCtx = null;
function getAC() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}
function playTone(minGrade) {
  var ac = getAC();
  if (!ac) return;
  try {
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    var t = ac.currentTime;
    if (minGrade >= 0.95) {
      o.type = 'triangle';
      o.frequency.setValueAtTime(880, t);
      o.frequency.exponentialRampToValueAtTime(1320, t + 0.1);
      g.gain.setValueAtTime(0.18, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.start(t); o.stop(t + 0.35);
    } else if (minGrade >= 0.85) {
      o.type = 'sine';
      o.frequency.setValueAtTime(660, t);
      o.frequency.exponentialRampToValueAtTime(880, t + 0.08);
      g.gain.setValueAtTime(0.15, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      o.start(t); o.stop(t + 0.22);
    } else if (minGrade >= 0.70) {
      o.type = 'sine';
      o.frequency.setValueAtTime(520, t);
      g.gain.setValueAtTime(0.12, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
      o.start(t); o.stop(t + 0.17);
    } else {
      o.type = 'sine';
      o.frequency.setValueAtTime(380, t);
      g.gain.setValueAtTime(0.08, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
      o.start(t); o.stop(t + 0.12);
    }
  } catch(e) {}
}
function playFail() {
  var ac = getAC();
  if (!ac) return;
  try {
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.connect(g); g.connect(ac.destination);
    var t = ac.currentTime;
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(220, t);
    o.frequency.exponentialRampToValueAtTime(60, t + 0.4);
    g.gain.setValueAtTime(0.15, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.start(t); o.stop(t + 0.5);
  } catch(e) {}
}

// ── 게임 종료 ──
function endGame(overBoundary) {
  gameActive = false;
  cancelAnimationFrame(rafId);
  playFail();
  comboEl.textContent = '';

  if (overBoundary) {
    ballEl.style.width  = (BOUNDARY_R * 2) + 'px';
    ballEl.style.height = (BOUNDARY_R * 2) + 'px';
    ballEl.style.background  = 'rgba(255,50,50,0.65)';
    ballEl.style.borderColor = 'rgba(255,50,50,0.9)';
    ballEl.style.boxShadow   = '0 0 50px rgba(255,50,50,0.8)';
    var rect = arenaEl.getBoundingClientRect();
    spawnParticles({clientX: rect.left+rect.width/2, clientY: rect.top+rect.height/2}, '#ff5555', 28);
  }

  var isNew = score > bestScore;
  if (isNew) { bestScore = score; localStorage.setItem('pBest', bestScore); }
  var avgP = prox_list.length ? Math.round(prox_list.reduce(function(a,b){return a+b;},0)/prox_list.length*100) : 0;
  totalGames++;
  localStorage.setItem('pGames', totalGames);
  gameHistory.unshift({score:score, taps:totalTaps, perf:perfectCount, avg:avgP, combo:maxCombo, date:new Date().toLocaleDateString('ko-KR')});
  if (gameHistory.length > 20) gameHistory.pop();
  localStorage.setItem('pHist', JSON.stringify(gameHistory));

  // 점수 등록 모달 표시
  showNickModal(score, perfectCount);

  // 결과 화면 표시에 필요한 값을 전역에 저장
  _resultIsNew = isNew;
  _resultAvgP  = avgP;
}

// ── 게임 시작 ──
function startGame() {
  if (gameActive) return; // 중복 방지
  getAC(); // iOS: 유저 제스처에서 AudioContext 초기화
  score=0; combo=0; maxCombo=0; totalTaps=0; perfectCount=0; prox_list=[]; stage=1;
  scoreEl.textContent='0';
  comboEl.textContent='';
  gradeLabel.textContent='준비하세요';
  gradeLabel.style.color='rgba(255,255,255,0.5)';
  gradeSub.textContent='경계선에 가까울수록 고득점';
  document.getElementById('r-stats').style.display='none';
  overlayEl.style.display='none';
  gameActive=true;
  startRound();
}

// ── 탭 전환 ──
function showTab(t) {
  ['r','s','h','lb'].forEach(function(id){
    var el = document.getElementById(id+'-panel');
    if (el) el.style.display = id===t ? (id==='r'?'block':'flex') : 'none';
  });
  document.querySelectorAll('.tab').forEach(function(el,i){
    el.classList.toggle('on', ['r','s','h','lb'][i]===t);
  });
  if (t==='s') buildSkins();
  if (t==='h') buildStats();
  if (t==='lb') loadLeaderboard();
}

function buildSkins() {
  var g = document.getElementById('skin-grid');
  g.innerHTML = '';
  SKINS.forEach(function(sk){
    var d = document.createElement('div');
    d.className = 'skin-card' + (sk.id===skin.id?' on':'');
    d.innerHTML = '<div class="skin-dot" style="background:'+sk.grad+'"></div><div class="skin-name">'+sk.name+'</div>';
    d.addEventListener('touchstart', function(e){e.preventDefault();setSkin(sk);}, {passive:false});
    d.addEventListener('mousedown', function(){setSkin(sk);});
    g.appendChild(d);
  });
}
function setSkin(sk) {
  skin = sk;
  applySkin();
  localStorage.setItem('pSkin', sk.id);
  buildSkins();
}

function buildStats() {
  document.getElementById('sg').innerHTML =
    '<div class="sc"><div class="sv">' + bestScore + '</div><div class="sl">최고 점수</div></div>' +
    '<div class="sc"><div class="sv">' + totalGames + '</div><div class="sl">총 게임 수</div></div>' +
    '<div class="sc"><div class="sv">' + (gameHistory.length?gameHistory[0].perf:0) + '</div><div class="sl">직전 PERFECT</div></div>' +
    '<div class="sc"><div class="sv">' + (gameHistory.length?gameHistory[0].avg+'%':'—') + '</div><div class="sl">직전 평균 근접도</div></div>';
  var hl = document.getElementById('hlist');
  if (!gameHistory.length) {
    hl.innerHTML = '<div style="text-align:center;padding:20px;color:rgba(255,255,255,0.25);font-size:13px">아직 기록이 없어요</div>';
    return;
  }
  hl.innerHTML = gameHistory.map(function(h){
    return '<div class="hi"><div><span class="hs">'+h.score+'점</span> <span class="hm">PERFECT '+h.perf+' · 평균근접 '+h.avg+'%</span></div><div class="hm">'+h.date+'</div></div>';
  }).join('');
}

function resetAll() {
  if (!confirm('모든 기록을 초기화할까요?')) return;
  bestScore=0; totalGames=0; gameHistory=[];
  localStorage.removeItem('pBest'); localStorage.removeItem('pGames'); localStorage.removeItem('pHist');
  bestDisp.textContent=0;
  buildStats();
}
function openSkin() { overlayEl.style.display='flex'; showTab('s'); }

// ── 초기화 ──
var sv = localStorage.getItem('pSkin');
if (sv) { var sk2 = SKINS.find(function(s){return s.id===sv;}); if(sk2){skin=sk2;applySkin();} }
bestDisp.textContent = bestScore;
</script>
